<svg xmlns="http://www.w3.org/2000/svg" width="760" height="256" viewBox="0 0 760 256" role="img" aria-label="cre: Correlated random effects. Multiway fixed effects. Unbalanced support. Stata">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f6e73"/>
      <stop offset="1" stop-color="#083d4a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4b942"/>
      <stop offset="1" stop-color="#e0891c"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Roboto Mono', Consolas, 'DejaVu Sans Mono', monospace; }
    </style>
  </defs>
  <!-- an irregular support: a product x market grid with cells missing, one cell lit -->
  <g transform="translate(36,34)">
    <g fill="url(#teal)" stroke="#ffffff" stroke-width="3">
      <rect x="0"   y="0"   width="42" height="42" rx="7"/>
      <rect x="48"  y="0"   width="42" height="42" rx="7"/>
      <rect x="96"  y="0"   width="42" height="42" rx="7"/>
      <rect x="0"   y="48"  width="42" height="42" rx="7"/>
      <rect x="96"  y="48"  width="42" height="42" rx="7"/>
      <rect x="144" y="48"  width="42" height="42" rx="7"/>
      <rect x="48"  y="96"  width="42" height="42" rx="7"/>
      <rect x="96"  y="96"  width="42" height="42" rx="7"/>
      <rect x="0"   y="144" width="42" height="42" rx="7"/>
      <rect x="48"  y="144" width="42" height="42" rx="7"/>
      <rect x="144" y="144" width="42" height="42" rx="7"/>
    </g>
    <!-- empty cells of the support, drawn as outlines -->
    <g fill="none" stroke="#9fb8bd" stroke-width="2" stroke-dasharray="5 5">
      <rect x="144" y="0"   width="42" height="42" rx="7"/>
      <rect x="48"  y="48"  width="42" height="42" rx="7"/>
      <rect x="0"   y="96"  width="42" height="42" rx="7"/>
      <rect x="144" y="96"  width="42" height="42" rx="7"/>
      <rect x="96"  y="144" width="42" height="42" rx="7"/>
    </g>
    <!-- the joint projection: one cell lit -->
    <rect x="96" y="48" width="42" height="42" rx="7" fill="url(#amber)" stroke="#ffffff" stroke-width="3"/>
  </g>
  <!-- wordmark -->
  <text class="mono" x="258" y="112" font-size="104" font-weight="700" fill="#083d4a" letter-spacing="-4">cre</text>
  <!-- the tagline, boxed like a Stata table: a title row, then two cells -->
  <rect x="262" y="128" width="456" height="82" rx="10" fill="#eef5f6" stroke="#0f6e73" stroke-width="2"/>
  <text class="mono" x="278" y="158" font-size="16" fill="#083d4a" letter-spacing="0.3">Correlated random effects</text>
  <line x1="262" y1="170" x2="718" y2="170" stroke="#0f6e73" stroke-width="1.5"/>
  <line x1="505" y1="170" x2="505" y2="210" stroke="#0f6e73" stroke-width="1.5"/>
  <text class="mono" x="278" y="196" font-size="15.5" fill="#0f6e73" letter-spacing="0.3">Multiway fixed effects</text>
  <text class="mono" x="520" y="196" font-size="15.5" fill="#0f6e73" letter-spacing="0.3">Unbalanced support</text>
  <!-- Stata, right-aligned under the box, with the c in the circle -->
  <text class="mono" x="718" y="240" font-size="18" font-weight="700" fill="#5b7a80" text-anchor="end" letter-spacing="0.5">Stata<tspan font-size="13" font-weight="400" dy="-6">&#169;</tspan></text>
</svg>
